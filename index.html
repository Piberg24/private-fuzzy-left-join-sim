<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Fuzzy Left Join, Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-shell">
    <header class="top-bar">
      <h1>Private Fuzzy Left Join</h1>
      <nav class="stepper" aria-label="Protocol steps">
        <ol class="stepper-list" id="stepper-list"></ol>
      </nav>
    </header>

    <section class="controls-bar" aria-label="Simulation controls">
      <div class="nav-buttons">
        <button type="button" id="btn-back" class="btn btn-secondary">← Back</button>
        <button type="button" id="btn-next" class="btn btn-primary">Next →</button>
        <button type="button" id="btn-reset" class="btn btn-ghost">Reset</button>
      </div>

      <div class="option-controls">
        <label class="toggle-label" for="toggle-phonetic">
          <input type="checkbox" id="toggle-phonetic">
          <span>Phonetic name key</span>
        </label>

        <button type="button" id="btn-second-candidate" class="btn btn-outline" aria-pressed="false">
          Add 2nd candidate in S
        </button>

        <button type="button" id="btn-randomise" class="btn btn-outline hidden">
          New random shares
        </button>

        <label class="toggle-label hidden" id="teacher-toggle-wrap" for="toggle-teacher">
          <input type="checkbox" id="toggle-teacher">
          <span>Reveal hidden bits</span>
        </label>
      </div>
    </section>

    <div class="step-bar" id="step-bar">
      <div class="step-heading">
        <span class="step-count" id="step-count">Step 1 of 6</span>
        <h2 class="step-title" id="step-title">Inputs</h2>
        <button type="button" id="btn-help" class="help-btn"
                aria-expanded="false" aria-controls="help-pop"
                aria-label="Explain this step" title="Explain this step (press ?)">?</button>
      </div>
      <span class="nav-hint" aria-hidden="true">
        <span class="hint-keys"><kbd>←</kbd> <kbd>→</kbd> to move, <kbd>?</kbd> to explain</span>
      </span>

      <div id="help-pop" class="help-pop" role="dialog" aria-modal="false" aria-labelledby="help-title">
        <div class="help-head">
          <span class="help-title" id="help-title">1/6: Inputs</span>
          <button type="button" id="btn-help-close" class="help-close" aria-label="Close explanation">×</button>
        </div>
        <ul class="help-list" id="help-list"></ul>
      </div>
    </div>

    <div id="status-hint" class="status-hint hidden" role="status" aria-live="polite"></div>

    <main id="stage" class="stage"></main>
  </div>

  <!-- Mobile bottom dock: steps 1..6 + Back / Next -->
  <nav class="mobile-dock" aria-label="Step navigation">
    <ol class="mobile-steps" id="mobile-steps"></ol>
    <div class="mobile-nav">
      <button type="button" id="btn-back-mobile" class="btn btn-secondary">← Back</button>
      <button type="button" id="btn-next-mobile" class="btn btn-primary">Next →</button>
    </div>
  </nav>

  <script src="app.js"></script>
</body>
</html>
